[project]
name = "easypyml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nils Malmberg" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "scikit-learn>=1.9.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "NPY", "D", "C90", "PT", "RUF"]
ignore = ["N802", "N803", "N806"]   # allow caps (for ML)

[tool.ruff.lint.pydocstyle]
convention = "numpy"        # docstrings NumPy

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]          # pas de docstrings exigées dans les tests

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest]
testpaths = ["tests", "src"]
addopts = ["--doctest-modules", "--import-mode=importlib"]
